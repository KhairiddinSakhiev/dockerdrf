services:
  db:
    image: postgres:16
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    restart: always
    env_file: .env
    command: sh /app/scripts.sh
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      - db

volumes:
  postgres_data:
